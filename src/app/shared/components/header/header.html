<header class="page-header">
  @if (titulo) {
    <h1
      class="page-header__titulo"
      [class.mb-1]="!!subtitulo"
      [class.mb-3]="!subtitulo"
      [attr.id]="tituloId || null"
    >
      @if (icono) {
        <i [class]="'bi bi-' + icono + ' me-2'" aria-hidden="true"></i>
      }
      {{ titulo }}
    </h1>
  }
  @if (subtitulo) {
    @if (titulo) {
      <p class="page-header__subtitulo">{{ subtitulo }}</p>
    } @else {
      <h2
        class="page-header__subtitulo page-header__subtitulo--principal"
        [attr.id]="tituloId || null"
      >
        @if (icono) {
          <i [class]="'bi bi-' + icono + ' me-2'" aria-hidden="true"></i>
        }
        {{ subtitulo }}
      </h2>
    }
  }
  @if (descripcion) {
    <p class="page-header__descripcion">{{ descripcion }}</p>
  }
</header>

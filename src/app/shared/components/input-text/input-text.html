<div
  class="form-group campo"
  [class.campo--error]="enError"
  [class.campo--exito]="enExito"
  [class.campo--deshabilitado]="readOnly"
>
  <label class="campo__label" [for]="id" [class.campo-etiqueta--oculta]="ocultarEtiqueta">
    {{ label }}
    @if (required) {
      <span class="campo__requerido" aria-hidden="true">&nbsp;*</span>
    }
  </label>
  <input
    class="form-control campo__control"
    [type]="type"
    [attr.step]="type === 'number' ? step : null"
    [id]="id"
    [placeholder]="placeholder"
    [value]="valorActual"
    [readOnly]="readOnly"
    [required]="required"
    [attr.aria-required]="required || null"
    [attr.aria-invalid]="enError || null"
    [attr.aria-describedby]="enError ? idError : null"
    (input)="onInput($event)"
    (change)="onChange($event)"
    (blur)="onBlur($event)"
  />
  @if (enError) {
    <small class="campo__mensaje-error" [id]="idError" role="alert">{{ mensajeError }}</small>
  }
</div>

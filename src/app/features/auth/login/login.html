<app-header></app-header>

<main class="login-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-6">
        <section class="login-card" aria-labelledby="login-title">
          <div class="login-card__header">
            <img
              src="assets/images/logoAlcaldia.svg"
              alt="Alcaldía de Santiago de Cali"
              class="login-card__logo"
            />
            <h3>Sistema institucional para la gestión de procesos</h3>              
          </div>

          <form class="login-card__body" [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
            <p class="login-card__description">
              Ingrese su usuario y contraseña para acceder al sistema.
            </p>

            <div class="form-group">
              <label for="usuario">Usuario</label>
              <input
                id="usuario"
                type="text"
                class="form-control"
                formControlName="usuario"
                placeholder="Ingrese su usuario"
                autocomplete="username"
              />
              @if (campoInvalido('usuario')) {
                <span class="login-card__error">El usuario es obligatorio.</span>
              }
            </div>

            <div class="form-group">
              <label for="contrasena">Contraseña</label>
              <input
                id="contrasena"
                type="password"
                class="form-control"
                formControlName="contrasena"
                placeholder="Ingrese su contraseña"
                autocomplete="current-password"
              />
              @if (campoInvalido('contrasena')) {
                <span class="login-card__error">La contraseña es obligatoria.</span>
              }
            </div>

            @if (error) {
              <div class="login-card__alert" role="alert">{{ error }}</div>
            }

            <div class="login-card__actions">
              <app-button
                label="Iniciar sesión"
                type="submit"
                [disabled]="cargando"
              ></app-button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </div>
</main>

<app-footer></app-footer>

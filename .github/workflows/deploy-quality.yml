
# Despliegue de saul3-front en QA (rama quality) → dist/saul3-front/browser/.
# DEPLOY_ROOT: directorio del clon en el runner.

name: Deploy saul3-front Quality

on:
  push:
    branches:
      - quality
  workflow_dispatch:

concurrency:
  group: saul3-front-quality
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to saul3-front quality
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      DEPLOY_ROOT: /var/www/qa/saul3-front

    defaults:
      run:
        shell: bash

    steps:
      - name: Verify server
        run: |
          echo "Servidor: $(hostname)"
          echo "Usuario: $(whoami)"
          echo "Directorio: $DEPLOY_ROOT"

          test "$(whoami)" = "saul"
          test -d "$DEPLOY_ROOT"

      - name: Update quality code
        working-directory: /var/www/qa/saul3-front
        run: |
          git config --global --add safe.directory "$DEPLOY_ROOT"

          git fetch origin quality

          git checkout quality
          git merge --ff-only origin/quality

          echo "Código actualizado:"
          git log -1 --oneline

      - name: Setup Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: /var/www/qa/saul3-front
        run: |
          npm ci --include=dev

      - name: Clean previous build
        working-directory: /var/www/qa/saul3-front
        run: |
          rm -rf dist/saul3-front

      - name: Build quality
        working-directory: /var/www/qa/saul3-front
        run: |
          npm run build:qa -- --base-href=/qa/

      - name: Verify deployment
        working-directory: /var/www/qa/saul3-front
        run: |
          echo "Verificando compilación..."

          if [ ! -f dist/saul3-front/browser/index.html ]; then
            echo "ERROR: No se encontró index.html"
            echo "Contenido de dist:"
            find dist -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Compilación correcta:"
          ls -lh dist/saul3-front/browser/index.html

          echo "Estado Git:"
          git status -sb

      - name: Deployment completed
        run: |
          echo "Despliegue QA finalizado correctamente."
